
services:
  postgres:
    image: postgres:16
    container_name: enterprise-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: enterprise_app
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "127.0.0.1:8080:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d enterprise_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: